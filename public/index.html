<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RoutineBar</title>
<style>
  :root {
    color-scheme: light dark;
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --t-xs: 12px; --t-sm: 13px; --t-md: 15px; --t-lg: 22px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-control: 6px; --r-group: 10px;

    --bg: #f6f6f7; --surface: #fff; --surface-2: #f0f0f2; --text: #1c1c1e; --muted: #6b6b70; --subtle: #8e8e93;
    --line: #e3e3e6; --line-strong: #d1d1d6;
    --accent: #0a64d8; --accent-hover: #0855b8; --accent-tint: #e8f0fc; --on-accent: #fff;
    --needs: #a35f00; --needs-bg: #fdf1dc; --failed: #c4271c; --failed-bg: #fde9e7;
    --done: #1e7d3a; --done-bg: #e3f4e7; --running: #6b6b70; --running-bg: #ececef;
    --shadow-bar: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.5); }
    :root {
      --bg: #161618; --surface: #1f1f22; --surface-2: #28282c; --text: #f2f2f4; --muted: #a1a1a6; --subtle: #7c7c82;
      --line: #2f2f33; --line-strong: #3d3d42;
      --accent: #3d8bfd; --accent-hover: #5c9dfd; --accent-tint: rgba(61, 139, 253, 0.16); --on-accent: #0b0b0c;
      --needs: #f0b44c; --needs-bg: rgba(240, 180, 76, 0.14); --failed: #ff6b5f; --failed-bg: rgba(255, 107, 95, 0.14);
      --done: #5fcf7e; --done-bg: rgba(95, 207, 126, 0.13); --running: #a1a1a6; --running-bg: rgba(255, 255, 255, 0.08);
      --shadow-bar: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: var(--t-sm)/1.45 var(--font); background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-control); }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  code, .mono { font-family: var(--mono); font-size: var(--t-xs); }
  .muted { color: var(--muted); }
  .subtle { color: var(--subtle); }
  .caps { font-size: var(--t-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .top-in { overflow-x: auto; max-width: 1040px; margin: 0 auto; padding: 0 var(--s5); height: 48px; display: flex; align-items: center; gap: var(--s5); }
  .brand { font-weight: 600; font-size: var(--t-sm); }
  .tabs { display: flex; gap: var(--s1); }
  .tabs a { color: var(--muted); padding: 6px 10px; border-radius: var(--r-control); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .tabs a:hover { color: var(--text); background: var(--surface-2); text-decoration: none; }
  .tabs a[aria-current="page"] { color: var(--text); background: var(--surface-2); }
  .count { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--text); color: var(--bg); font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
  .count:empty { display: none; }
  main { max-width: 1040px; margin: 0 auto; padding: var(--s6) var(--s5) 96px; }

  /* Buttons and controls */
  button { font: inherit; color: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--r-control); border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-weight: 500; letter-spacing: 0.01em; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--surface-2); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.quiet:hover { background: var(--surface-2); color: var(--text); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.danger-text { border-color: transparent; background: transparent; color: var(--failed); padding: 0; }
  .kbd { font: 500 11px var(--font); color: var(--subtle); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  input[type=text], input[type=time], input:not([type]), select, textarea {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-control); height: 30px; padding: 0 10px;
  }
  textarea { height: auto; padding: 10px 12px; width: 100%; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  input.wide { width: 100%; }
  input.mono-in { font-family: var(--mono); font-size: 12.5px; }

  /* Segmented control and chips: native radios and checkboxes, restyled */
  .seg { justify-self: start; display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--line); flex-wrap: wrap; }
  .seg label, .chips label { position: relative; cursor: pointer; }
  .seg input, .chips input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; padding: 4px 12px; border-radius: 6px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
  .seg input:focus-visible + span, .chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chips { justify-self: start; display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .chips span { display: grid; place-items: center; min-width: 44px; height: 30px; padding: 0 8px; border-radius: var(--r-control); border: 1px solid var(--line-strong); font-weight: 500; color: var(--muted); background: var(--surface); }
  .chips input:checked + span { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }

  .switch { position: relative; width: 32px; height: 20px; border-radius: 10px; border: 0; padding: 0; background: var(--line-strong); cursor: pointer; flex: none; transition: background-color 0.15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.15s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(12px); }

  /* Status: the only place status colors appear */
  .state { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .state.needs_input { color: var(--needs); } .state.failed { color: var(--failed); } .state.done { color: var(--done); } .state.running { color: var(--running); }
  .state.quiet { color: var(--text); }
  .state.quiet.needs_input::before { background: var(--needs); } .state.quiet.failed::before { background: var(--failed); }
  .state.quiet.done::before { background: var(--done); } .state.quiet.running::before { background: var(--running); }
  .state.running::before { animation: pulse 1.2s ease-in-out infinite; }
  .pill { padding: 2px 8px 2px 7px; border-radius: 999px; font-size: var(--t-xs); }
  .pill.needs_input { background: var(--needs-bg); } .pill.failed { background: var(--failed-bg); } .pill.done { background: var(--done-bg); } .pill.running { background: var(--running-bg); }
  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .state.running::before { animation: none; } .switch, .switch::after { transition: none; } }

  /* Page heads */
  .page-head { display: flex; align-items: center; gap: var(--s4); margin-bottom: var(--s5); }
  .page-head .grow { flex: 1; min-width: 0; }
  .headline { font-size: var(--t-lg); font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .sub { margin-top: 6px; color: var(--muted); font-size: var(--t-sm); }

  /* Grouped lists (inbox, run items) */
  .group { margin-bottom: var(--s6); }
  .group-head { display: flex; align-items: baseline; gap: var(--s2); margin: 0 0 var(--s2) 2px; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-group); overflow: hidden; }
  .list > li + li { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: flex-start; gap: var(--s4); padding: var(--s3) var(--s4); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 0; background: var(--accent-tint); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: var(--t-md); font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
  .row-note { margin-top: 2px; color: var(--text); opacity: 0.85; max-width: 72ch; text-wrap: pretty; }
  .row-note.tail { white-space: pre-line; }
  .row-note.muted { color: var(--muted); }
  .waiting-on { margin-top: var(--s2); color: var(--muted); overflow-wrap: anywhere; }
  .waiting-on strong { color: var(--text); font-weight: 600; }
  .waiting-details { margin-top: var(--s2); }
  .waiting-details p { margin: var(--s2) 0; }
  .row-meta { margin-top: 4px; color: var(--muted); font-size: var(--t-xs); letter-spacing: 0.01em; display: flex; flex-wrap: wrap; gap: 0 6px; }
  .row-meta > * + *::before { content: "·"; margin-right: 6px; color: var(--subtle); }
  .row-meta a { color: var(--muted); }
  /* The primary verb turns solid only on the row being worked, so a long inbox is not a wall of blue. */
  .row .btn.primary:not(:hover) { background: var(--surface); color: var(--accent); border-color: var(--line-strong); }
  .row:hover .btn.primary, .row:focus-within .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .row-actions { display: flex; gap: var(--s2); align-items: center; flex: none; padding-top: 1px; }
  details.group > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: var(--s2); margin: 0 0 var(--s2) 2px; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::before { content: "▸"; color: var(--muted); font-size: 13px; width: 12px; }
  details.group[open] > summary::before { content: "▾"; }
  .empty { padding: var(--s7) 0; }
  .empty .headline { margin-bottom: var(--s2); }
  .hint { color: var(--subtle); font-size: var(--t-xs); margin-top: var(--s5); }
  .freshness { margin: 0 0 var(--s5); padding: var(--s3) 0; border-block: 1px solid var(--line); }
  .freshness summary { cursor: pointer; color: var(--muted); }
  .freshness summary strong { color: var(--text); font-weight: 500; }
  .freshness ul { list-style: none; padding: 0; margin: var(--s3) 0 0; }
  .freshness li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s1) var(--s4); padding: var(--s2) 0; }
  .freshness li > span { color: var(--muted); }

  /* Tables */
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-group); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: var(--t-xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 10px var(--s3); border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px var(--s3); border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.link { cursor: pointer; }
  tbody tr.link:hover { background: var(--surface-2); }
  tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.name a { color: var(--text); font-weight: 500; }
  td.name .muted { font-size: var(--t-xs); margin-top: 1px; }
  td.nowrap, th.nowrap { white-space: nowrap; }
  td.right, th.right { text-align: right; }
  td.clip { max-width: 0; width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .off td:not(:first-child):not(:last-child) { opacity: 0.55; }

  /* Run detail */
  .back { display: inline-block; margin-bottom: var(--s4); color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s6); margin: var(--s4) 0 var(--s5); }
  .facts div { display: grid; gap: 2px; }
  .summary { font-size: var(--t-md); line-height: 1.55; max-width: 72ch; margin: 0 0 var(--s5); text-wrap: pretty; }
  .error-box { color: var(--failed); background: var(--failed-bg); border-radius: var(--r-control); padding: var(--s3) var(--s4); font-family: var(--mono); font-size: var(--t-xs); margin-bottom: var(--s5); }
  .kind { flex: none; width: 76px; padding-top: 3px; }
  pre.log { margin: var(--s2) 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-group); padding: var(--s4); max-height: 520px; overflow: auto; }
  details.disclosure > summary { cursor: pointer; color: var(--muted); font-weight: 500; }
  .is-done { opacity: 0.55; }

  /* Editor */
  .sect { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s6); padding: var(--s6) 0; border-top: 1px solid var(--line); }
  .sect:first-of-type { border-top: 0; padding-top: var(--s2); }
  .sect-head h2 { font-size: var(--t-md); font-weight: 600; }
  .sect-head p { margin: 6px 0 0; color: var(--muted); text-wrap: pretty; }
  .sect-body { display: grid; gap: var(--s5); min-width: 0; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > label, .field > .label { font-weight: 500; }
  .field > select { justify-self: start; }
  .field .help { color: var(--muted); font-size: var(--t-xs); letter-spacing: 0.01em; }
  .suggest { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .suggest button { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 1px 6px; font: 11.5px var(--mono); color: var(--muted); cursor: pointer; }
  .suggest button:hover { color: var(--text); border-color: var(--line-strong); }
  .inline { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .times { display: grid; gap: var(--s2); justify-items: start; }
  .preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-group); padding: var(--s4); display: grid; gap: var(--s3); }
  .preview .sentence { font-size: var(--t-md); font-weight: 500; }
  .preview .sentence.bad { color: var(--failed); font-weight: 400; font-size: var(--t-sm); }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-control); overflow: hidden; }
  .week > div { background: var(--surface); padding: var(--s2); min-height: 76px; font-size: var(--t-xs); }
  .week .d { font-weight: 600; margin-bottom: 4px; }
  .week .d.today { color: var(--accent); }
  .week .t { color: var(--text); }
  .week .none { color: var(--subtle); }
  .week .many { font-weight: 600; }
  .note { color: var(--muted); font-size: var(--t-xs); }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); box-shadow: var(--shadow-bar); }
  .savebar-in { max-width: 1040px; margin: 0 auto; padding: var(--s3) var(--s5); display: flex; align-items: center; gap: var(--s3); }
  .savebar .status { flex: 1; min-width: 0; color: var(--muted); }
  .savebar .status.dirty { color: var(--text); font-weight: 500; }
  .savebar .err { color: var(--failed); font-weight: 400; }
  .toast { position: fixed; bottom: var(--s5); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 500; z-index: 9; }
  .toast:empty { display: none; }
  .toast a { color: inherit; text-decoration: underline; margin-left: 6px; }

  /* Item actions: overflow menu, inline errors, history */
  .btn.more { width: 28px; padding: 0; color: var(--muted); }
  .btn[aria-busy="true"] { cursor: progress; }
  .menu { inset: auto; margin: 0; padding: 4px; min-width: 200px; border: 1px solid var(--line-strong); border-radius: var(--r-group); background: var(--surface); color: var(--text); }
  .menu > * { display: block; width: 100%; padding: 6px 10px; border: 0; border-radius: var(--r-control); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; white-space: nowrap; }
  .menu > *:hover, .menu > *:focus-visible { background: var(--surface-2); text-decoration: none; outline: none; }
  .menu > *:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .row-err { margin-top: 4px; font-size: var(--t-xs); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .row-err .msg { color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
  .history { margin-top: 6px; }
  .history a { color: var(--muted); text-decoration: underline; }

  /* Import sheet: native dialog, bordered like a list container, dimmed page behind */
  dialog.sheet { width: min(760px, calc(100vw - 48px)); max-height: calc(100vh - 96px); margin: 48px auto auto; padding: 0; border: 1px solid var(--line); border-radius: var(--r-group); background: var(--bg); color: var(--text); overflow: hidden; }
  dialog.sheet[open] { display: flex; flex-direction: column; }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.28); }
  .sheet-head { padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line); background: var(--surface); }
  .sheet-head h2 { font-size: var(--t-md); font-weight: 600; }
  .sheet-head p { margin: 2px 0 0; color: var(--muted); }
  .sheet-body { flex: 1; overflow: auto; padding: var(--s5) var(--s5) 0; }
  .sheet-foot { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s5); border-top: 1px solid var(--line); background: var(--surface); }
  .sheet-foot .status { flex: 1; color: var(--muted); }
  .row > input[type=checkbox] { flex: none; width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--accent); }
  label.row-title { display: block; cursor: pointer; }
  .sched { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px var(--s3); margin: var(--s2) 0 0; }
  .sched dt { color: var(--muted); }
  .sched dd { margin: 0; overflow-wrap: anywhere; }
  .notes { list-style: none; margin: var(--s2) 0 0; padding: 0; color: var(--muted); font-size: var(--t-xs); display: grid; gap: 2px; }
  .row details.disclosure { margin-top: var(--s2); }
  .row pre.log { max-height: 240px; }

  @media (max-width: 960px) {
    .sect { grid-template-columns: 1fr; gap: var(--s4); }
  }
  @media (max-width: 760px) { .hide-narrow { display: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand">RoutineBar</span>
    <nav class="tabs" aria-label="Sections">
      <a href="#inbox">Inbox <span class="count" id="inboxCount"></span></a>
      <a href="#routines">Routines</a>
      <a href="#runs">Runs</a>
      <a href="#settings">Settings</a>
    </nav>
  </div>
</header>
<main id="view"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="menu" id="menu" popover role="menu" aria-label="More actions"></div>
<dialog class="sheet" id="actSheet" aria-labelledby="actTitle">
  <div class="sheet-head"><h2 id="actTitle"></h2><p id="actSub"></p></div>
  <div class="sheet-body" id="actBody"></div>
  <div class="sheet-foot"><span class="status" id="actStatus"></span><button type="button" class="btn quiet" id="actCancel">Cancel</button><button type="button" class="btn primary" id="actGo" disabled></button></div>
</dialog>
<dialog class="sheet" id="importSheet" aria-labelledby="impTitle">
  <div class="sheet-head"><h2 id="impTitle">Import routines</h2><p>From Claude and Codex on this Mac. Imported routines start off, and nothing changes at the source.</p></div>
  <div class="sheet-body" id="impBody"></div>
  <div class="sheet-foot"><span class="status" id="impStatus"></span><button type="button" class="btn quiet" id="impCancel">Cancel</button><button type="button" class="btn primary" id="impGo" disabled>Import 0 routines</button></div>
</dialog>
<script type="module">
import { parseCron, matches, describe } from "/cron.mjs";
import { inboxModel, summaryLine, freshnessModel } from "/inbox-model.mjs";

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json" } });
  const body = await res.json();
  if (!res.ok) throw Object.assign(new Error(body.error), { runId: body.runId });
  return body;
}

/* ---------- Time formatting ---------- */
const clock = (h, m = 0) => new Date(2000, 0, 1, h, m).toLocaleTimeString([], { hour: "numeric", ...(m ? { minute: "2-digit" } : {}) });
const absTime = (iso) => new Date(iso).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function rel(iso, now = Date.now()) {
  const s = Math.round((Date.parse(iso) - now) / 1000);
  const a = Math.abs(s);
  const v = a < 45 ? null : a < 3600 ? `${Math.round(a / 60)} min` : a < 86400 ? `${Math.round(a / 3600)} h` : `${Math.round(a / 86400)} d`;
  if (!v) return s > 0 ? "in a moment" : "just now";
  return s > 0 ? `in ${v}` : `${v} ago`;
}
const timeEl = (iso) => (iso ? `<time datetime="${esc(iso)}" title="${esc(absTime(iso))}">${rel(iso)}</time>` : "");
const refreshTimes = () => $$("time[datetime]").forEach((t) => (t.textContent = rel(t.dateTime)));
setInterval(refreshTimes, 30e3);
function duration(a, b) {
  const s = Math.round((Date.parse(b) - Date.parse(a)) / 1000);
  if (s < 60) return `${s} s`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m} min ${s % 60} s` : `${Math.floor(m / 60)} h ${m % 60} min`;
}

const STATE = { running: "Running", done: "Done", needs_input: "Needs you", failed: "Failed" };
const state = (s, pill) => `<span class="state ${s}${pill ? " pill" : ""}">${STATE[s] ?? esc(s)}</span>`;

/* ---------- Schedule model ----------
   Builder model: { mode: "times", days, times: [[h, m]] } | { mode: "interval", every, unit, window: [h1, h2] | null, days } | { mode: "custom" }
   days are dow numbers 0..6. The cron string stays the saved truth; the model is derived from it and back. */
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const DAY = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const EVERY = [[5, "min"], [10, "min"], [15, "min"], [20, "min"], [30, "min"], [1, "hour"], [2, "hour"], [3, "hour"], [4, "hour"], [6, "hour"], [8, "hour"], [12, "hour"]];
const sorted = (set) => [...set].sort((a, b) => a - b);
const isRun = (v) => v.every((x, i) => i === 0 || x === v[i - 1] + 1);

function dowField(days) {
  if (days.length === 7) return "*";
  const parts = [];
  for (let i = 0; i < days.length; ) {
    let j = i;
    while (j + 1 < days.length && days[j + 1] === days[j] + 1) j++;
    parts.push(j - i >= 2 ? `${days[i]}-${days[j]}` : days.slice(i, j + 1).join(","));
    i = j + 1;
  }
  return parts.join(",");
}

function toCron(s) {
  const dow = dowField(sorted(s.days));
  if (s.mode === "interval") {
    const span = s.window ? `${s.window[0]}-${s.window[1]}` : "*";
    return s.unit === "min" ? `*/${s.every} ${span} * * ${dow}` : `0 ${span}/${s.every} * * ${dow}`;
  }
  const byMinute = new Map();
  for (const [h, m] of [...s.times].sort((a, b) => a[0] * 60 + a[1] - (b[0] * 60 + b[1]))) byMinute.set(m, [...(byMinute.get(m) ?? []), h]);
  return [...byMinute].map(([m, hs]) => `${m} ${[...new Set(hs)].join(",")} * * ${dow}`).join("; ");
}

function fromCron(text) {
  let cs;
  try { cs = parseCron(text); } catch { return null; }
  const days = (c) => (c.domStar && c.dom.size === 31 && c.month.size === 12 ? sorted(c.dow) : null);
  const d0 = days(cs[0]);
  if (!d0 || cs.some((c) => days(c)?.join() !== d0.join())) return null;
  if (cs.length === 1) {
    const c = cs[0];
    const mins = sorted(c.minute), hours = sorted(c.hour);
    const window = hours.length === 24 ? null : [hours[0], hours.at(-1)];
    const step = mins[1] - mins[0];
    if (mins.length > 1 && isRun(hours) && 60 % step === 0 && mins.length === 60 / step && mins.every((m, i) => m === i * step) && EVERY.some(([n, u]) => n === step && u === "min"))
      return { mode: "interval", every: step, unit: "min", window, days: d0 };
    const hstep = hours[1] - hours[0];
    if (mins.length === 1 && mins[0] === 0 && hours.length >= 3 && hours.every((h, i) => h === hours[0] + i * hstep) && EVERY.some(([n, u]) => n === hstep && u === "hour")) {
      const full = hours[0] === 0 && hours.at(-1) + hstep >= 24;
      return { mode: "interval", every: hstep, unit: "hour", window: full ? null : [hours[0], hours.at(-1)], days: d0 };
    }
  }
  const times = cs.flatMap((c) => sorted(c.hour).flatMap((h) => sorted(c.minute).map((m) => [h, m])));
  if (times.length > 12) return null;
  return { mode: "times", days: d0, times: times.sort((a, b) => a[0] * 60 + a[1] - (b[0] * 60 + b[1])) };
}

function daysText(days) {
  const k = sorted(days).join();
  if (k === "0,1,2,3,4,5,6") return "every day";
  if (k === "1,2,3,4,5") return "weekdays";
  if (k === "0,6") return "weekends";
  return WEEK.filter((d) => days.includes(d)).map((d) => DAY[d]).join(", ");
}
const listFmt = new Intl.ListFormat("en", { type: "conjunction" });
const cap = (s) => s[0].toUpperCase() + s.slice(1);

function sentence(s, cron) {
  if (!s) return cron ? describe(parseCron(cron)) : "";
  if (s.mode === "times") return cap(`${daysText(s.days)} at ${listFmt.format(s.times.map(([h, m]) => clock(h, m)))}`);
  const every = s.every === 1 && s.unit === "hour" ? "Every hour" : `Every ${s.every} ${s.unit === "min" ? "minutes" : "hours"}`;
  let span = "";
  if (s.window) {
    const lastMin = s.unit === "min" ? 60 - s.every : 0;
    const lastHour = s.unit === "min" ? s.window[1] : s.window[0] + Math.floor((s.window[1] - s.window[0]) / s.every) * s.every;
    span = `, ${clock(s.window[0])} to ${clock(lastHour, lastMin)}`;
  }
  return `${every}${span}, ${daysText(s.days)}`;
}
const scheduleText = (cron) => { try { return sentence(fromCron(cron), cron); } catch { return cron; } };

function weekRuns(cron, from = new Date()) {
  const c = parseCron(cron);
  const start = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  return Array.from({ length: 7 }, (_, i) => {
    const day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const runs = [];
    for (let m = 0; m < 1440; m++) {
      const t = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, m);
      if (t > from && matches(c, t)) runs.push(t);
    }
    return { day, runs };
  });
}

/* ---------- Item actions ----------
   Each item from the API carries its applicable actions, one marked primary. The row shows that one as its
   primary verb and the rest in one shared popover menu. Items are kept by "runId|itemKey" for the handlers. */
const rowItems = new Map();
const rowErrors = new Map();
const actionUrl = (runId, key, id) => `/api/runs/${encodeURIComponent(runId)}/items/${encodeURIComponent(key)}/actions/${id}`;
const rowOf = (el) => el.closest(".row");
const itemOf = (row) => rowItems.get(`${row.dataset.run}|${row.dataset.item}`);
const actionBtn = (a, attrs) => a.href
  ? `<a ${attrs} data-action="${a.id}" href="${esc(a.href)}" target="_blank" rel="noopener">${esc(a.label)}</a>`
  : `<button type="button" ${attrs} data-action="${a.id}">${esc(a.label)}</button>`;

function itemActions(runId, item, fallback = "", threadUrl) {
  rowItems.set(`${runId}|${item.key}`, item);
  const main = threadUrl ? null : item.actions.find((a) => a.primary);
  const primary = threadUrl ? `<a class="btn primary" data-primary href="${esc(threadUrl)}" target="_blank" rel="noopener">Open session</a>` : main ? actionBtn(main, `class="btn primary" data-primary`) : fallback;
  const more = item.actions.length > (main ? 1 : 0) ? `<button type="button" class="btn quiet more" data-more aria-haspopup="menu" aria-expanded="false" aria-label="More actions" title="More actions (A)">⋯</button>` : "";
  return primary + more;
}

function rowError(key) {
  const err = rowErrors.get(key);
  return err ? `<div class="row-err" role="alert"><span class="state failed">${esc(err.label)} failed</span><span class="msg">${esc(err.message)}</span></div>` : "";
}

const menu = $("#menu");
let menuOwner = null;
function openMenu(btn) {
  const row = rowOf(btn), item = itemOf(row);
  const shown = $("[data-primary]", row)?.dataset.action;
  menu.innerHTML = item.actions.filter((a) => a.id !== shown).map((a) => actionBtn({ ...a, label: a.label + (a.needsConfirm ? "…" : "") }, `role="menuitem"`)).join("");
  menuOwner = btn;
  btn.setAttribute("aria-expanded", "true");
  menu.showPopover();
  const r = btn.getBoundingClientRect();
  menu.style.top = `${Math.max(8, r.bottom + 4 + menu.offsetHeight > innerHeight ? r.top - 4 - menu.offsetHeight : r.bottom + 4)}px`;
  menu.style.left = `${Math.max(8, r.right - menu.offsetWidth)}px`;
  menu.firstElementChild?.focus();
}
menu.addEventListener("toggle", (ev) => {
  if (ev.newState !== "closed" || !menuOwner) return;
  menuOwner.setAttribute("aria-expanded", "false");
  if (!document.activeElement || document.activeElement === document.body || menu.contains(document.activeElement)) menuOwner.focus();
});
menu.addEventListener("click", (ev) => {
  const el = ev.target.closest("a, button");
  if (!el) return;
  const owner = menuOwner;
  menu.hidePopover();
  if (el.tagName === "BUTTON") trigger(rowOf(owner), el.dataset.action, owner);
});
menu.addEventListener("keydown", (ev) => {
  const items = [...menu.children], i = items.indexOf(document.activeElement);
  if (ev.key === "ArrowDown") items[(i + 1) % items.length].focus();
  else if (ev.key === "ArrowUp") items.at(i - 1).focus();
  else if (ev.key === "Home") items[0].focus();
  else if (ev.key === "End") items.at(-1).focus();
  else if (ev.key === "Tab") menu.hidePopover();
  else return;
  ev.preventDefault();
});
addEventListener("scroll", () => menu.matches(":popover-open") && menu.hidePopover(), { passive: true });

function trigger(row, id, btn) {
  const a = itemOf(row).actions.find((x) => x.id === id);
  return a.needsConfirm ? openConfirm(row, a) : execute(row, a, {}, btn);
}

async function execute(row, a, input, btn) {
  const { run: runId, item: key } = row.dataset;
  const rowKey = row.dataset.key;
  const label = btn.textContent;
  btn.disabled = true;
  btn.setAttribute("aria-busy", "true");
  btn.textContent = btn.classList.contains("more") ? "…" : `${a.label}…`;
  let res;
  try { res = await post(actionUrl(runId, key, a.id), input); } catch (e) { res = { ok: false, message: e.message }; }
  btn.disabled = false;
  btn.removeAttribute("aria-busy");
  btn.textContent = label;
  if (res.ok) { rowErrors.delete(rowKey); toast(res.reused ? "Opened the existing thread" : res.message, res.threadUrl); }
  else rowErrors.set(rowKey, { label: ACTION_LABEL[a.id] ?? a.label, message: res.message });
  await render();
  $$(".row").find((r) => r.dataset.key === rowKey)?.focus();
  return res;
}

const PR_STATE = { OPEN: "Open", MERGED: "Merged", CLOSED: "Closed" };
const REVIEW = { APPROVED: "Approved", CHANGES_REQUESTED: "Changes requested", REVIEW_REQUIRED: "Review required" };
const MERGE_STATE = { CLEAN: "Ready to merge", HAS_HOOKS: "Ready to merge", UNSTABLE: "Mergeable, some checks not passing", BLOCKED: "Blocked by branch rules", BEHIND: "Behind the base branch", DIRTY: "Has conflicts", DRAFT: "Draft", UNKNOWN: "Not computed yet" };
const METHOD = { squash: "Squash and merge", merge: "Create a merge commit", rebase: "Rebase and merge" };
function checksHtml({ passed, failed, pending }) {
  const parts = [failed && `<span class="state failed">${failed} failed</span>`, pending && `<span class="state running">${pending} pending</span>`, passed && `<span class="state done">${passed} passed</span>`].filter(Boolean);
  return parts.length ? `<span class="inline" style="gap:var(--s3)">${parts.join("")}</span>` : `<span class="subtle">No checks</span>`;
}

async function openConfirm(row, a) {
  const sheet = $("#actSheet"), body = $("#actBody"), go = $("#actGo"), status = $("#actStatus");
  const item = itemOf(row);
  $("#actTitle").textContent = a.id === "merge" ? "Merge pull request" : a.id === "approve" ? "Approve pull request" : a.label;
  $("#actSub").textContent = item.title;
  body.innerHTML = `<p><span class="state running">Checking live status</span></p>`;
  status.textContent = "";
  go.textContent = a.id === "merge" ? "Merge" : a.id === "approve" ? "Approve" : "Start thread";
  go.disabled = true;
  $("#actCancel").onclick = () => sheet.close();
  sheet.showModal();
  let p;
  try { p = await post(`${actionUrl(row.dataset.run, item.key, a.id)}/preview`); } catch (e) { body.innerHTML = ""; status.innerHTML = `<span class="state failed">Couldn't load</span> ${esc(e.message)}`; return; }
  if (p.needsPath) {
    body.innerHTML = `<div class="field" style="margin-bottom:var(--s5)"><label for="actPath">Local repo</label><input id="actPath" class="wide mono-in" placeholder="/Users/you/Projects/repo" spellcheck="false" autocomplete="off"><span class="help">No local clone was found under ~/Projects. Enter the absolute path of a git repo for the task.</span></div>`;
  } else if (p.reuse || p.repoPath) {
    body.innerHTML = `<p style="margin:0 0 var(--s5)">${p.reuse ? "This item already has a thread; it opens again." : `The task opens in <span class="mono">${esc(p.repoPath)}</span>.`}</p>`;
  } else {
    body.innerHTML = `<dl class="sched" style="margin:0 0 var(--s5);row-gap:var(--s2)">
      <dt>Pull request</dt><dd><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a> <span class="muted mono">${esc(p.headRefName)}</span></dd>
      <dt>State</dt><dd>${esc(PR_STATE[p.state] ?? p.state)}${p.isDraft ? ", draft" : ""}</dd>
      <dt>Checks</dt><dd>${checksHtml(p.checks)}</dd>
      <dt>Review</dt><dd>${esc(REVIEW[p.reviewDecision] ?? "No review yet")}</dd>
      <dt>Mergeable</dt><dd>${esc(MERGE_STATE[p.mergeStateStatus] ?? p.mergeStateStatus)}</dd>
      ${a.id === "merge" ? `<dt><label for="actMethod">Method</label></dt><dd>${p.methods.length ? `<select id="actMethod">${p.methods.map((m) => `<option value="${m}" ${m === p.method ? "selected" : ""}>${METHOD[m]}</option>`).join("")}</select>` : `<span class="subtle">This repo allows no merge method</span>`}</dd>` : ""}
    </dl>`;
    if (p.blocked || (a.id === "merge" && !p.methods.length)) {
      status.innerHTML = `<span class="state needs_input">Can't ${a.id}</span> ${esc(p.blocked ? `${p.blocked[0].toUpperCase()}${p.blocked.slice(1)}.` : "")}`;
      if ($("#actMethod")) $("#actMethod").disabled = true;
      return;
    }
  }
  go.disabled = false;
  go.onclick = async () => {
    const input = a.id === "merge" ? { method: $("#actMethod").value } : p.needsPath ? { repoPath: $("#actPath").value.trim() } : {};
    status.textContent = "";
    const res = await execute(row, a, input, go);
    if (res.ok) sheet.close();
    else status.innerHTML = `<span class="state failed">Failed</span> ${esc(res.message)}`;
  };
  ($("#actPath") ?? go).focus();
}

    if (details.open) expandedWaiting.add(key);
    else expandedWaiting.delete(key);
  };

async function markDone(row) {
  const rows = $$(".row");
  const next = rows[rows.indexOf(row) + 1] ?? rows[rows.indexOf(row) - 1];
  const { run, item } = row.dataset;
  row.style.visibility = "hidden";
  try {
    await post(`/api/runs/${encodeURIComponent(run)}/ack`, item ? { key: item } : undefined);
  } catch (e) {
    row.style.visibility = "";
    return toast(e.message);
  }
  const nextKey = next?.dataset.key;
  await views.inbox($("#view"));
  if (nextKey) $$(".row").find((r) => r.dataset.key === nextKey)?.focus();
}

document.addEventListener("click", (ev) => {
  const done = ev.target.closest("[data-done]");
  if (done) markDone(done.closest(".row"));
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.closest?.("#menu, dialog")) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.target.closest("input, textarea, select, [contenteditable]")) return;
  if (route() !== "inbox") return;
  const rows = $$(".row").filter((r) => r.offsetParent);
  if (!rows.length) return;
  const cur = ev.target.closest?.(".row");
  const i = rows.indexOf(cur);
  const k = ev.key.toLowerCase();
  if (k === "j" || ev.key === "ArrowDown") (rows[i + 1] ?? rows[i < 0 ? 0 : i])?.focus();
  else if (k === "k" || ev.key === "ArrowUp") (rows[i - 1] ?? rows[0]).focus();
  else if (cur && ev.key === "Enter" && ev.target === cur) $("[data-primary]", cur).click();
  else if (cur && k === "o") openRow(cur);
  else if (cur && k === "a" && $("[data-more]", cur)) $("[data-more]", cur).click();
  else if (cur && k === "d") markDone(cur);
  else return;
  ev.preventDefault();
});

function candidateRow(c, i) {

function sourceGroup(id, label, result) {
  let rows;
  if (!result) rows = `<li class="row"><span class="state running">Checking ${esc(label)}</span></li>`;
  else if (!result.ok) rows = `<li class="row"><div class="row-main"><span class="state failed">Couldn't read ${esc(label)}</span><div class="row-note">${esc(result.error)}</div></div></li>`;
  else if (!result.candidates.length) rows = `<li class="row"><span class="muted">Nothing found</span></li>`;
  else rows = result.candidates.map((c, i) => candidateRow(c, `${id}-${i}`)).join("");
  return `<section class="group"><h3 class="group-head caps">${esc(label)}</h3><ul class="list">${rows}</ul></section>`;

function openImport() {
  const sheet = $("#importSheet"), body = $("#impBody"), go = $("#impGo");
  const gen = ++importGen;
  const results = {};
  const sync = () => {
    const n = $$("input[type=checkbox]:checked:not(:disabled)", body).length;
    go.textContent = `Import ${n} ${n === 1 ? "routine" : "routines"}`;
    go.disabled = !n;
  };
  const paint = () => {
    const keep = new Set($$("input[type=checkbox]", body).filter((c) => !c.checked).map((c) => `${c.dataset.source}\n${c.dataset.sourceId}`));
    const all = SOURCES.map(([id]) => results[id]);
    const empty = all.every((r) => r?.ok && !r.candidates.length);
    body.innerHTML = empty
      ? `<div class="empty"><h3 class="headline">Nothing to import</h3><p class="sub">No routines found in Claude cloud, Claude desktop, or Codex.</p></div>`
      : SOURCES.map(([id, label]) => sourceGroup(id, label, results[id])).join("");
    for (const c of $$("input[type=checkbox]", body)) if (keep.has(`${c.dataset.source}\n${c.dataset.sourceId}`)) c.checked = false;
    $("#impStatus").textContent = all.every(Boolean) ? "" : "Looking for routines…";
    sync();
  };
  body.onchange = sync;
  $("#impCancel").onclick = () => sheet.close();
  go.onclick = async () => {
    const items = $$("input[type=checkbox]:checked:not(:disabled)", body).map((c) => ({ source: c.dataset.source, sourceId: c.dataset.sourceId }));
    go.disabled = true;
    $("#impStatus").textContent = "Importing…";
    try {
      const created = await post("/api/import", { items });
      sheet.close();
      toast(created.length ? `Imported ${created.length} ${created.length === 1 ? "routine" : "routines"}` : "Nothing new to import");
      render();
    } catch (e) {
      $("#impStatus").textContent = e.message;
      sync();
    }
  };
  paint();
  sheet.showModal();
  for (const [id, label] of SOURCES) {
    api(`/api/import?source=${id}`)
      .then((r) => r.sources[0])
      .catch((e) => ({ id, label, ok: false, error: e.message }))
      .then((r) => { if (gen === importGen) { results[id] = r; paint(); } });
  }
}

  const mode = s.mode;

    <div class="field"><span class="label">Days</span>${dayChips(s.days)}</div>`;

function readBuilder(root, mode) {
  const days = $$("input[name=day]:checked", root).map((c) => Number(c.value));
  if (mode === "times") return { mode, days, times: $$("input[type=time]", root).filter((i) => i.value).map((i) => i.value.split(":").map(Number)) };
  const [every, unit] = $("#every", root).value.split("|");
  const window = $("#useWindow", root).checked ? [Number($("#w0", root).value), Number($("#w1", root).value)].sort((a, b) => a - b) : null;
  return { mode, every: Number(every), unit, window, days };
}

      <div class="field"><span class="label">Routine type</span>${radios("routineType", [["instructions", "Instructions"], ["teams", "Teams monitor"]], r.teams || newTeams ? "teams" : "instructions")}</div>
      <div class="field"><span class="label">Agent</span>${radios("agent", AGENTS, r.agent)}</div>
      <div class="field" id="commandField"><label for="command">Command</label><input id="command" class="wide mono-in" value="${esc(r.command)}" spellcheck="false" autocomplete="off" placeholder="my-agent --model &quot;$MODEL&quot; &quot;$PROMPT&quot;"><span class="help">Runs with sh. Gets $PROMPT and $MODEL in its environment and must print the result block.</span></div>
      <div class="field"><label for="model">Model</label><input id="model" class="wide mono-in" list="modelList" value="${esc(r.model)}" spellcheck="false" autocomplete="off" required><datalist id="modelList"></datalist><div class="suggest" id="modelSuggest"></div></div>
      <div class="field"><label for="cwd">Working directory</label><input id="cwd" class="wide mono-in" value="${esc(r.cwd)}" placeholder="/Users/you/Projects" spellcheck="false" autocomplete="off" required><span class="help">The agent starts in this folder. Code threads open here too unless an item names its own repo.</span></div>
    </div></section>

    <section class="sect" id="teamsSection" hidden><div class="sect-head"><h2>Teams monitoring</h2><p>One channel or group chat per routine. Find mentions that need you and keep track of who acts next.</p></div><div class="sect-body">
      <div class="field"><span class="label">Conversation type</span>${radios("teamsSource", [["channel", "Channel"], ["chat", "Group chat"]], teams.source ?? (r.teams ? "channel" : "chat"))}<span class="help">Mac client monitoring currently supports group chats.</span></div>
      <div class="field" id="teamsChatNameField" hidden><label for="teamsChatName">Chat name</label><input id="teamsChatName" class="wide" value="${esc(teams.chatName)}" placeholder="(GSS) Guest Services Support" maxlength="200" autocomplete="off"><span class="help">A display name to recognize this monitor.</span></div>
      <div class="field" id="teamsChatIdField" hidden><label for="teamsChatId">Chat link or ID</label><input id="teamsChatId" class="wide" value="${esc(teams.chatId)}" placeholder="https://teams.microsoft.com/l/chat/19:…/conversations" autocomplete="off"><span class="help">Paste the group-chat link from Teams. The monitor uses its exact chat ID.</span></div>
      <div class="field" id="teamsTeamField"><label for="teamsTeam">Team</label><input id="teamsTeam" class="wide" value="${esc(teams.team)}" placeholder="Engineering" maxlength="200" autocomplete="off"><span class="help">Exact team name or ID.</span></div>
      <div class="field" id="teamsChannelField"><label for="teamsChannel">Channel</label><input id="teamsChannel" class="wide" value="${esc(teams.channel)}" placeholder="Backend" maxlength="200" autocomplete="off"><span class="help">Exact channel name or ID within this team.</span></div>
      <div class="field"><span class="label">Watch for</span><label class="inline"><input type="checkbox" id="teamsPersonal" ${teams.personalMentions ? "checked" : ""}> @mentions of me</label><span class="help">Uses the account signed in to the Mac Teams client.</span></div>
      <div class="field" id="teamsTagsField"><label for="teamsTags">Group tags</label><textarea id="teamsTags" rows="3" placeholder="Engineering&#10;On-call">${esc(teams.tags.join("\n"))}</textarea><span class="help">One Teams tag per line, with or without @. Matches personal mentions or any listed tag, not ordinary keywords. Leave empty to watch only personal mentions.</span></div>
      <div class="field" id="teamsRepliesField"><label class="inline"><input type="checkbox" id="teamsReplies" ${teams.includeReplies ? "checked" : ""}> Include mentions in thread replies</label></div>
      <div class="field"><label for="teamsLookback">Look for new mentions from the last</label><select id="teamsLookback">${[...new Set([1, 6, 24, 72, 168, teams.lookbackHours])].sort((a, b) => a-b).map(h => `<option value="${h}" ${h === teams.lookbackHours ? "selected" : ""}>${h === 1 ? "Hour" : h < 24 ? `${h} hours` : `${h / 24} ${h === 24 ? "day" : "days"}`}</option>`).join("")}</select><span class="help">Previously tracked, unresolved mentions stay in the inbox until resolved or marked Done.</span></div>
      <div class="field"><span class="label">Teams access</span><div class="inline"><button type="button" class="btn" id="teamsCheck">Check access</button><span class="help" id="teamsAccess" role="status">Not checked. Reads the signed-in Mac Teams client cache; no Microsoft 365 connector is needed.</span></div><span class="help">Only messages downloaded by the Mac client are covered. Open the chat in Teams to refresh it. After saving, use Run now to check the monitor.</span></div>
    </div></section>

    <section class="sect"><div class="sect-head"><h2>Schedule</h2><p>Local time. Runs missed while the Mac sleeps are skipped.</p></div><div class="sect-body">
      ${needsSchedule ? `<p class="inline" style="margin:0">${NEEDS_SCHEDULE}<span class="muted">${esc(SOURCE_LABEL[r.importedFrom.source] ?? r.importedFrom.source)} did not say when this runs. Pick a schedule and save.</span></p>` : ""}
      <div class="seg" role="radiogroup" aria-label="Schedule type" id="modes"><label><input type="radio" name="mode" value="times"><span>At set times</span></label><label><input type="radio" name="mode" value="interval"><span>On an interval</span></label></div>
      <div id="builder" class="sect-body"></div>
      <div class="preview" aria-live="polite"><div class="sentence" id="sentence"></div><div class="week" id="week"></div></div>
      <details class="disclosure" id="adv"><summary>Advanced: cron expression</summary>
        <div class="field" style="margin-top:var(--s3)"><input id="cron" class="wide mono-in" value="${esc(r.schedule)}" spellcheck="false" autocomplete="off" aria-label="Cron expression"><span class="help" id="cronHelp"></span></div></details>
    </div></section>

    <section class="sect"><div class="sect-head"><h2 id="instructionsTitle">Instructions</h2><p id="promptHelp"></p></div><div class="sect-body">
      <textarea id="prompt" rows="16" spellcheck="false" aria-label="Instructions">${esc(r.prompt)}</textarea>
    </div></section>

    <section class="sect" id="t3Section"><div class="sect-head"><h2>When code is needed</h2><p>Code tasks open in the editor chosen in Settings. Existing routines can keep their own agent and permission choices.</p></div><div class="sect-body">
      <label class="inline"><input type="checkbox" id="useTaskDefaults" ${r.t3.useDefaults ? "checked" : ""}> Use the agent and permission defaults from <a href="#settings">Settings</a></label>
      <div id="taskOverrides" class="sect-body" ${r.t3.useDefaults ? "hidden" : ""}>
      <div class="field"><span class="label">Coding agent</span>${radios("provider", PROVIDERS, r.t3.provider)}</div>
      <div class="field"><label for="t3model">Model</label><input id="t3model" class="wide mono-in" list="t3List" value="${esc(r.t3.model)}" spellcheck="false" autocomplete="off" required><datalist id="t3List"></datalist><div class="suggest" id="t3Suggest"></div></div>
      <div class="field"><span class="label">Permissions</span>${radios("runtimeMode", MODES, r.t3.runtimeMode)}<span class="help" id="modeHelp"></span></div>
      </div>
    </div></section>
    ${existing ? `<section class="sect"><div class="sect-head"><h2>Delete</h2><p>Past runs stay in Runs.</p></div><div class="sect-body"><div><button type="button" class="btn danger-text" id="del">Delete this routine</button></div></div></section>` : ""}

    <div class="savebar"><div class="savebar-in"><span class="status" id="saveStatus"></span><a class="btn quiet" href="#routines" id="cancel">Cancel</a><button class="btn primary" id="save">${existing ? "Save changes" : "Create routine"}</button></div></div>
  </form>`;

  const form = $("#ed", el);
  const v = (sel) => $(sel, form).value;
  const radio = (name) => $(`input[name=${name}]:checked`, form)?.value;
  const enabledBtn = $("#enabled", form);

  const suggest = (listId, boxId, input, opts) => {
    $(listId, form).innerHTML = opts.map((o) => `<option value="${esc(o)}">`).join("");
    $(boxId, form).innerHTML = opts.length ? `<span class="help">Suggested:</span>${opts.map((o) => `<button type="button" data-v="${esc(o)}">${esc(o)}</button>`).join("")}` : "";
    for (const b of $$("button", $(boxId, form))) b.onclick = () => ((input.value = b.dataset.v), changed());
  };
  const syncAgent = () => {
    const agent = radio("agent");
    $("#commandField", form).hidden = agent !== "custom";
    $("label[for=model]", form).textContent = agent === "custom" ? "Model (passed as $MODEL)" : "Model";
    $("#promptHelp", form).textContent = radio("routineType") === "teams" ? "Optional extra guidance for deciding which mentions need you. Conversation, filters, and the read-only monitoring instructions are supplied automatically." : agent === "custom" ? "Passed to the command as $PROMPT. Optional." : "What to check, what never to do, and how findings map to needs_you, code and fyi items. RoutineBar appends the output format.";
    suggest("#modelList", "#modelSuggest", $("#model", form), models.agents[agent] ?? []);
  };
  const syncTeamsSource = () => {
    const chat = radio("teamsSource") === "chat";
    $('input[name=teamsSource][value=channel]', form).disabled = true;
    for (const id of ["teamsChatNameField", "teamsChatIdField"]) $(`#${id}`, form).hidden = !chat;
    for (const id of ["teamsTeamField", "teamsChannelField", "teamsTagsField", "teamsRepliesField"]) $(`#${id}`, form).hidden = chat;
    $("#teamsPersonal", form).disabled = chat;
    if (chat) $("#teamsPersonal", form).checked = true;
  };
  const syncType = () => {
    const isTeams = radio("routineType") === "teams";
    $("#teamsSection", form).hidden = !isTeams;
    $("#t3Section", form).hidden = isTeams;
    const custom = $('input[name=agent][value=custom]', form);
    custom.disabled = isTeams;
    if (isTeams && custom.checked) {
      $('input[name=agent][value=claude]', form).checked = true;
      $("#model", form).value = "opus";
    }
    $("#instructionsTitle", form).textContent = isTeams ? "Extra guidance" : "Instructions";
    $("#prompt", form).rows = isTeams ? 5 : 16;
    syncTeamsSource();
    syncAgent();
  };
  let accessCheck = 0;
  $("#teamsCheck", form).onclick = async () => {
    const check = ++accessCheck;
    const button = $("#teamsCheck", form), result = $("#teamsAccess", form);
    button.disabled = true;
    result.textContent = "Reading the Mac Teams cache…";
    try {
      const status = await post("/api/teams/access", { teams: body().teams });
      if (check === accessCheck) result.textContent = status.message;
    } catch (e) { if (check === accessCheck) result.textContent = e.message; }
    finally { if (check === accessCheck) button.disabled = false; }
  };
  const syncT3 = () => {
    suggest("#t3List", "#t3Suggest", $("#t3model", form), models.t3[radio("provider")] ?? []);
    $("#modeHelp", form).textContent = MODES.find((m) => m[0] === radio("runtimeMode"))?.[2] ?? "";
  };

  const showSchedule = (cron) => {
    const s = $("#sentence", form);
    try {
      s.textContent = scheduleText(cron);
      s.className = "sentence";
      $("#cronHelp", form).textContent = describe(parseCron(cron));
      const today = new Date().toDateString();
      $("#week", form).innerHTML = weekRuns(cron).map(({ day, runs }) => `<div>
        <div class="d${day.toDateString() === today ? " today" : ""}">${day.toDateString() === today ? "Today" : day.toLocaleDateString([], { weekday: "short", day: "numeric" })}</div>
        ${!runs.length ? `<div class="none">No runs</div>` : runs.length <= 4 ? runs.map((t) => `<div class="t">${clock(t.getHours(), t.getMinutes())}</div>`).join("") : `<div class="many">${runs.length} runs</div><div class="muted">${clock(runs[0].getHours(), runs[0].getMinutes())} to ${clock(runs.at(-1).getHours(), runs.at(-1).getMinutes())}</div>`}
      </div>`).join("");
      $("#week", form).hidden = false;
      return true;
    } catch (e) {
      s.textContent = e.message;
      s.className = "sentence bad";
      $("#cronHelp", form).textContent = "";
      $("#week", form).hidden = true;
      return false;
    }
  };
  const renderBuilder = () => {
    for (const i of $$("input[name=mode]", form)) i.checked = i.value === sched.mode;
    $("#builder", form).innerHTML = builderHtml(sched);
    if (sched.mode === "custom") $("#adv", form).open = true;
  };
  const fromBuilder = () => {
    sched = readBuilder($("#builder", form), sched.mode);
    if (sched.mode === "times" && !sched.times.length) return;
    $("#cron", form).value = toCron(sched);
    showSchedule($("#cron", form).value);
    changed();
  };

  const b = $("#builder", form);
  b.addEventListener("change", (ev) => {
    if (ev.target.name === "day" && !$$("input[name=day]:checked", b).length) ev.target.checked = true;
    if (ev.target.id === "useWindow") $("#windowRow", b).hidden = !ev.target.checked;
    fromBuilder();
  });
  b.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.days) for (const c of $$("input[name=day]", b)) c.checked = t.dataset.days.split(",").includes(c.value);
    if (t.hasAttribute("data-add-time")) {
      const last = sched.times.at(-1) ?? [8, 0];
      sched.times.push([(last[0] + 1) % 24, last[1]]);
      renderBuilder();
      $$("input[type=time]", b).at(-1).focus();
    }
    if (t.hasAttribute("data-remove")) { t.closest(".time-row").remove(); fromBuilder(); renderBuilder(); return; }
    fromBuilder();
  });
  $("#modes", form).addEventListener("change", () => {
    const days = sched.days ?? [1, 2, 3, 4, 5];
    sched = radio("mode") === "times" ? { mode: "times", days, times: [[9, 0]] } : { mode: "interval", every: 30, unit: "min", window: [8, 18], days };
    renderBuilder();
    fromBuilder();
  });
  $("#cron", form).addEventListener("input", (ev) => {
    sched = fromCron(ev.target.value) ?? { mode: "custom" };
    renderBuilder();
    showSchedule(ev.target.value);
    changed();
  });

  const body = () => ({
    name: v("#name").trim(), enabled: enabledBtn.getAttribute("aria-checked") === "true", schedule: v("#cron"), agent: radio("agent"), model: v("#model").trim(),
    ...(radio("agent") === "custom" && { command: v("#command") }), cwd: v("#cwd").trim(), prompt: v("#prompt"),
    ...(radio("routineType") === "teams" && { teams: {
      source: radio("teamsSource"),
      ...(radio("teamsSource") === "chat" ? { chatName: v("#teamsChatName").trim(), chatId: v("#teamsChatId").trim() } : { team: v("#teamsTeam").trim(), channel: v("#teamsChannel").trim() }),
      personalMentions: radio("teamsSource") === "chat" || $("#teamsPersonal", form).checked,
      tags: radio("teamsSource") === "chat" ? [] : v("#teamsTags").split("\n").map(t => t.trim().replace(/^@/, "").trim()).filter(Boolean), includeReplies: radio("teamsSource") === "chat" || $("#teamsReplies", form).checked, lookbackHours: Number(v("#teamsLookback")),
    } }),
    t3: { provider: radio("provider"), model: v("#t3model").trim(), runtimeMode: radio("runtimeMode"), useDefaults: $("#useTaskDefaults", form).checked },
    // Saving from the editor confirms the schedule, so needsSchedule is dropped here.
    ...(r.importedFrom && { importedFrom: { source: r.importedFrom.source, sourceId: r.importedFrom.sourceId } }),
  });
  const initial = JSON.stringify(body());
  const status = $("#saveStatus", form);
  function changed(err) {
    dirty = JSON.stringify(body()) !== initial;
    status.className = "status" + (dirty ? " dirty" : "");
    status.innerHTML = err ? `<span class="err">${esc(err)}</span>` : dirty ? "Unsaved changes" : needsSchedule ? "Save to confirm the schedule" : existing ? "No changes" : "";
    $("#save", form).disabled = !!existing && !dirty && !needsSchedule;
  }
  form.addEventListener("input", (ev) => { if (!ev.target.closest("#builder, #cron")) changed(); });
  form.addEventListener("change", (ev) => {
    if (ev.target.id === "useTaskDefaults") $("#taskOverrides", form).hidden = ev.target.checked;
    if (ev.target.name === "routineType") syncType();
    if (ev.target.name === "teamsSource") syncTeamsSource();
    if (ev.target.name === "agent") {
      const suggestedModel = models.agents[radio("agent")]?.[0];
      if (suggestedModel) $("#model", form).value = suggestedModel;
      syncAgent();
      accessCheck++;
      $("#teamsCheck", form).disabled = false;
      $("#teamsAccess", form).textContent = "Not checked. Use Check access to read the local Mac Teams cache.";
    }
    if (ev.target.name === "provider" || ev.target.name === "runtimeMode") syncT3();
    if (!ev.target.closest("#builder")) changed();
  });
  enabledBtn.onclick = () => {
    const on = enabledBtn.getAttribute("aria-checked") !== "true";
    enabledBtn.setAttribute("aria-checked", on);
    $("#onLabel", form).textContent = on ? "On" : "Off";
    changed();
  };

  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const data = body();
    const missing = [!data.name && "a name", !data.cwd.startsWith("/") && "an absolute working directory", data.agent === "custom" && !data.command?.trim() && "a command", data.agent !== "custom" && !data.teams && !data.prompt.trim() && "instructions", !data.model && "a model", !data.t3.model && "a thread model"].filter(Boolean);
    if (data.teams) {
      if (data.teams.source === "chat") {
        if (!data.teams.chatName) missing.push("a chat name");
        if (!data.teams.chatId) missing.push("a chat link or ID");
      } else {
        if (!data.teams.team) missing.push("a Teams team");
        if (!data.teams.channel) missing.push("a Teams channel");
      }
      if (!data.teams.personalMentions && !data.teams.tags.length) missing.push("personal mentions or a group tag");
    }
    if (missing.length) return changed(`Add ${listFmt.format(missing)}.`);
    let rid = existing?.id;
    if (!rid) {
      const taken = new Set(["new", ...routines.map((x) => x.id)]);
      rid = slug(data.name);
      for (let n = 2; taken.has(rid); n++) rid = `${slug(data.name)}-${n}`;
    }
    $("#save", form).disabled = true;
    status.textContent = "Saving…";
    try {
      await api(`/api/routines/${encodeURIComponent(rid)}`, { method: "PUT", body: JSON.stringify(data) });
      dirty = false;
      toast(existing ? "Saved" : "Routine created");
      location.hash = existing ? "#routines" : `#routines/${rid}`;
    } catch (e) {
      $("#save", form).disabled = false;
      changed(e.message);
    }
  };
  if (existing) $("#del", form).onclick = async () => {
    if (!confirm(`Delete ${r.name}? Past runs stay.`)) return;
    await api(`/api/routines/${r.id}`, { method: "DELETE" });
    dirty = false;
    location.hash = "#routines";
  };

  syncType();
  syncT3();
  renderBuilder();
  showSchedule(r.schedule);
  changed();
  if (!existing) $("#name", form).focus();
}

/* Settings */
views.settings = async (el) => {
  const [prefs, models] = await Promise.all([api('/api/settings'), api('/api/models')]);
  const options = (items, value) => items.map(([v, label]) => `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(label)}</option>`).join('');
  const field = (id, label, help = '') => `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="wide mono-in" value="${esc(prefs[id])}" autocomplete="off" spellcheck="false">${help ? `<span class="help">${help}</span>` : ''}</div>`;
  el.innerHTML = `<form id="settingsForm">
    <div class="page-head"><div class="grow"><h1 class="headline">Settings</h1><p class="sub">Where coding tasks open and how your agents run on this Mac.</p></div></div>
    <section class="sect"><div class="sect-head"><h2>Editor</h2><p>Applies to code tasks from routines and inbox actions.</p></div><div class="sect-body">
      <div class="field"><label for="editorChoice">Open coding tasks in</label><select id="editorChoice">${options([['t3', 'T3'], ['vscode', 'VS Code'], ['cursor', 'Cursor'], ['terminal', 'Terminal']], prefs.editor)}</select><span class="help" id="editorHelp"></span></div>
      <div id="t3Connection" class="sect-body">${field('t3AppPath', 'T3 application path', 'Leave empty to detect T3 automatically. Use an absolute path ending in .app to choose another install.')}
        <span class="help">Detected: ${esc(prefs.detectedT3App || 'No T3 installation found')}</span>
        <div class="inline"><button type="button" class="btn" id="checkT3">Check connection</button><span class="help" id="t3Status" role="status"></span></div>
      </div>
    </div></section>
    <section class="sect"><div class="sect-head"><h2>Agent defaults</h2><p>Used by new routines and code tasks set to use Settings defaults. Existing routine overrides stay in effect.</p></div><div class="sect-body">
      <div class="field"><label for="defaultAgent">Default agent</label><select id="defaultAgent">${options([['claude','Claude'],['codex','Codex']], prefs.defaultAgent)}</select></div>
      ${field('claudeModel', 'Claude model')}${field('codexModel', 'Codex model')}
      <div class="field"><label for="taskPermissions">Coding task permissions</label><select id="taskPermissions">${options(MODES, prefs.taskPermissions)}</select><span class="help" id="taskPermissionHelp"></span></div>
    </div></section>
    <section class="sect"><div class="sect-head"><h2>Desktop notifications</h2><p>Alerts on this Mac, even when the dashboard is closed.</p></div><div class="sect-body">
      <label class="inline"><input type="checkbox" id="desktopNotifications" ${prefs.desktopNotifications ? 'checked' : ''}> Enable desktop notifications</label>
      <div class="field"><label for="notificationMode">Notify me about</label><select id="notificationMode">${options([['attention','New items needing me, failures, and coding sessions'],['all','Every completed run']], prefs.notificationMode)}</select><span class="help">Needs-attention alerts skip unchanged items and work waiting on others.</span></div>
      <div class="inline"><button type="button" class="btn" id="testNotification">Send test notification</button><span class="help" id="notificationStatus" role="status"></span></div>
      <span class="help">If no banner appears, allow Script Editor notifications in macOS System Settings → Notifications. Focus modes can silence banners.</span>
    </div></section>
    <section class="sect"><div class="sect-head"><h2>Scheduled checks</h2><p>Runs happen in the background using each routine's agent and model.</p></div><div class="sect-body">
      <div class="field"><label for="scheduledPermissions">Background permissions</label><select id="scheduledPermissions">${options([['read-only','Read only'],['full-access','Full access']], prefs.scheduledPermissions)}</select><span class="help">Read only uses Claude plan mode or Codex's read-only sandbox. Full access allows unattended edits and commands without approval prompts. Custom-command routines use their own permissions.</span></div>
    </div></section>
    <section class="sect"><div class="sect-head"><h2>Command-line tools</h2><p>Used for background checks and Terminal sessions. Sign in through each tool before running routines.</p></div><div class="sect-body">
      ${field('claudeCommand', 'Claude executable', 'Executable name on your login PATH, or an absolute path. No command arguments.')}
      ${field('codexCommand', 'Codex executable', 'Executable name on your login PATH, or an absolute path. No command arguments.')}
    </div></section>
    <div class="savebar"><div class="savebar-in"><span class="status" id="settingsStatus" role="status"></span><button class="btn primary" id="saveSettings" disabled>Save settings</button></div></div>
  </form>`;
  const form = $('#settingsForm', el);
  const value = id => $('#' + id, form).value;
  const body = () => ({ editor: value('editorChoice'), desktopNotifications: $('#desktopNotifications', form).checked, notificationMode: value('notificationMode'), ...Object.fromEntries(['t3AppPath','defaultAgent','claudeModel','codexModel','taskPermissions','scheduledPermissions','claudeCommand','codexCommand'].map(k => [k, value(k).trim()])) });
  let initial = JSON.stringify(body());
  const sync = () => {
    const t3 = value('editorChoice') === 't3';
    $('#t3Connection', form).hidden = !t3;
    $('#editorHelp', form).textContent = t3 ? 'T3 opens an agent thread directly.' : value('editorChoice') === 'terminal' ? 'Starts an interactive Claude or Codex session in macOS Terminal with the task prompt.' : 'Opens the project in this editor and starts Claude or Codex in macOS Terminal with the task prompt.';
    $('#taskPermissionHelp', form).textContent = value('taskPermissions') === 'full-access' ? 'Allows edits and commands without asking.' : value('taskPermissions') === 'auto-accept-edits' ? 'Claude accepts file edits automatically. Codex uses workspace write access and asks for command approvals.' : 'Claude asks before edits and commands. Codex starts read only and can request approval for changes.';
    dirty = initial !== JSON.stringify(body());
    $('#saveSettings', form).disabled = !dirty;
    $('#checkT3', form).disabled = dirty;
    $('#testNotification', form).disabled = dirty || !$('#desktopNotifications', form).checked;
    $('#notificationMode', form).disabled = !$('#desktopNotifications', form).checked;
    $('#settingsStatus', form).textContent = dirty ? 'Unsaved changes. Save before checking the connection.' : '';
  };
  form.oninput = sync; form.onchange = sync;
  $('#claudeModel', form).setAttribute('list', 'settingsClaudeModels');
  $('#codexModel', form).setAttribute('list', 'settingsCodexModels');
  form.insertAdjacentHTML('beforeend', `<datalist id="settingsClaudeModels">${models.t3.claudeAgent.map(v=>`<option value="${esc(v)}">`).join('')}</datalist><datalist id="settingsCodexModels">${models.t3.codex.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`);
  $('#checkT3', form).onclick = async () => {
    const button = $('#checkT3', form), status = $('#t3Status', form);
    button.disabled = true; status.textContent = 'Connecting to T3…';
    try { const result = await post('/api/settings/check-t3'); status.textContent = result.ok ? 'Connected to T3' : 'Could not connect'; }
    catch (e) { status.textContent = e.message; }
    finally { button.disabled = dirty; }
  };
  $('#testNotification', form).onclick = async () => {
    const button = $('#testNotification', form), status = $('#notificationStatus', form);
    button.disabled = true; status.textContent = 'Sending…';
    try { await post('/api/settings/test-notification'); status.textContent = 'Sent to macOS. Check your notification banners.'; }
    catch(e) { status.textContent = e.message; }
    finally { button.disabled = dirty || !$('#desktopNotifications', form).checked; }
  };
  form.onsubmit = async ev => {
    ev.preventDefault(); const button = $('#saveSettings', form); button.disabled = true;
    const saved = JSON.stringify(body());
    try { await api('/api/settings', { method: 'PUT', body: saved }); initial = saved; sync(); if (!dirty) $('#settingsStatus', form).textContent = 'Settings saved'; }
    catch(e) { $('#settingsStatus', form).textContent = e.message; button.disabled = false; }
  };
  sync();
};
views.sessions = async (el, id) => {
  const task = await api(`/api/sessions/${encodeURIComponent(id)}`);
  el.innerHTML = `<div class="page-head"><div class="grow"><a class="back" href="#inbox">← Inbox</a><h1 class="headline">${esc(task.title)}</h1><p class="sub">Opened in ${esc(({vscode:'VS Code',cursor:'Cursor',terminal:'Terminal'})[task.editor])} on this Mac · ${timeEl(task.createdAt)}</p></div></div>
    <section class="sect"><div class="sect-head"><h2>Agent session</h2><p>Continue in the Terminal window on your Mac.</p></div><div class="sect-body"><p>${esc(task.config.provider === 'claudeAgent' ? 'Claude' : 'Codex')} · <span class="mono">${esc(task.config.model)}</span></p><p class="mono">${esc(task.cwd)}</p><div><button class="btn" id="reopenSession">Start another session</button></div><span class="help">Opens another Terminal session with this task's original prompt and permissions.</span><p id="sessionStatus" role="status"></p></div></section>
    <section class="sect"><div class="sect-head"><h2>Task prompt</h2></div><div class="sect-body"><pre class="log">${esc(task.prompt)}</pre></div></section>`;
  $('#reopenSession', el).onclick = async ev => {
    ev.target.disabled = true;
    try { await post(`/api/sessions/${encodeURIComponent(id)}/open`); $('#sessionStatus', el).textContent = 'Opened on your Mac'; }
    catch(e) { $('#sessionStatus', el).textContent = e.message; }
    finally { ev.target.disabled = false; }
  };
};

/* ---------- Router ---------- */
const route = () => (location.hash.slice(1).split("?")[0] || "inbox").split("/")[0];
async function render(opts) {
  const [name, arg] = (location.hash.slice(1).split("?")[0] || "inbox").split("/");
  const view = views[name] ? name : "inbox";
  for (const a of $$(".tabs a")) a.hash === `#${view}` ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  if (view !== "inbox") refreshCount();
  const el = $("#view");
  try { await views[view](el, arg === undefined ? undefined : decodeURIComponent(arg), opts); }
  catch (e) { el.innerHTML = `<div class="empty"><h1 class="headline">Something went wrong</h1><p class="sub">${esc(e.message)}</p></div>`; }
  document.title = view === "inbox" && $("#inboxCount").textContent ? `(${$("#inboxCount").textContent}) RoutineBar` : "RoutineBar";
}
addEventListener("hashchange", () => {
  if (dirty && !confirm("Discard unsaved changes?")) { history.replaceState(null, "", lastHash); return; }
  dirty = false;
  lastHash = location.hash;
  window.scrollTo(0, 0);
  render();
});
render();
async function refreshCount() {
  try { $("#inboxCount").textContent = summaryLine(inboxModel((await api("/api/inbox")).entries))?.actionable || ""; } catch {}
}
// A poll never repaints under an open menu or dialog.
setInterval(() => (route() === "inbox" && !menu.matches(":popover-open") && !$("dialog[open]") ? render({ poll: true }) : refreshCount()), 15e3);
</script>
